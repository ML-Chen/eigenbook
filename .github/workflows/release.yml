# Turns a pushed tag "vN" into a GitHub release. The tagged commit (on the "builds" branch)
# holds release/eigenbook.apk (already signed), release/book.html, release/version.json and
# release/NOTES.md, built by android/release.sh in the private source repo.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/eigenbook.apk release/book.html release/version.json \
            --title "$(head -1 release/NOTES.md | sed 's/^# //')" \
            --notes-file release/NOTES.md --latest
