# Publishes a GitHub release for each build pushed to the "builds" branch.
# Each build commit holds release/eigenbook.apk (already signed), release/book.html,
# release/version.json and release/NOTES.md, made by android/release.sh in the private source repo.
# The release tag is "v" + version from version.json; the workflow creates it on the pushed commit.
name: Release
on:
  push:
    branches: [builds]
    paths: ["release/version.json", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(jq -r .version release/version.json)"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" \
            release/eigenbook.apk release/book.html release/version.json \
            --target "$GITHUB_SHA" \
            --title "$(head -1 release/NOTES.md | sed 's/^# //')" \
            --notes-file release/NOTES.md --latest
